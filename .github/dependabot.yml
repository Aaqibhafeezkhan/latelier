# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # The @types/node major follows the Node that Electron embeds (Node 24 for
    # Electron 44), not the latest Node release: newer typings let tsc accept
    # APIs that throw at runtime in main and in tests. Bump it by hand together
    # with Electron.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Every `uses:` in .github/workflows is pinned to a commit SHA rather than a
  # tag, because a tag is mutable and a compromised action rewrites it. That
  # trade is only safe with something moving the pins forward — an unattended
  # pin is a dependency frozen at whatever was current the day it was written.
  # Dependabot rewrites both the SHA and the trailing version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
