name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for dry-running the workflow without cutting a tag.
  workflow_dispatch:

# Read-only by default. Only the `publish` job, which creates the GitHub
# release, is granted `contents: write`.
permissions:
  contents: read

jobs:
  # Gates the release on the same checks CI runs, against the tagged commit
  # itself. It runs them rather than polling CI for this SHA: a tag pushed right
  # after a merge races the push-to-main CI run, `cancel-in-progress` can leave
  # a SHA with no successful run at all, and polling would need `actions: read`
  # plus a timeout loop. Tradeoff: e2e is not run here (it is four shards and
  # ~10 minutes on its own); it is still owed on the PR that merged the commit.
  verify:
    name: Verify (tag, lint, typecheck, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same budget as ci.yml's test job, which runs the same steps.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # A release tag must name the version it ships, or the auto-update feed
      # and the release page disagree. First, so a bad tag fails in seconds.
      # Skipped on workflow_dispatch, which keeps dry runs usable.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" \
            || { echo "::error::tag $GITHUB_REF_NAME != $expected (package.json version)"; exit 1; }

      # See ci.yml for why this is `npm ci --ignore-scripts`.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Copied from ci.yml: electron's own installer no-ops on this runner, and
      # the diagnostic-service integration test requires the binary.
      - name: Install Electron binary
        run: |
          ver=$(node -p "require('./node_modules/electron/package.json').version")
          zip="electron-v${ver}-linux-x64.zip"
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "/tmp/${zip}" \
            "https://github.com/electron/electron/releases/download/v${ver}/${zip}"
          rm -rf node_modules/electron/dist
          unzip -q "/tmp/${zip}" -d node_modules/electron/dist
          printf electron > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron \
            && echo "electron binary OK ($ver)" \
            || { echo "::error::electron binary missing after unzip"; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit IPC secret allowlist
        run: npm run audit:ipc

      # See ci.yml: one mongod download before the integration workers race
      # to fill an empty cache.
      - name: Download mongod
        run: node node_modules/mongodb-memory-server/postinstall.js

      - name: Unit + integration + component tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
            build_script: electron-builder --mac --x64 --arm64
          - os: windows-latest
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
            build_script: electron-builder --win --x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # See ci.yml for why this is `npm ci --ignore-scripts`.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # No project-managed ABI rebuild step: better-sqlite3 13 is an N-API
      # addon whose prebuilt binary serves every Node/Electron ABI.
      # electron-builder still prepares native dependencies while packaging,
      # but does not compile better-sqlite3 from source.
      - name: Build renderer + main
        run: npm run build

      # Fails the job when any signing/notarization secret is missing. Without
      # APPLE_API_* electron-builder skips notarization silently and would ship
      # an un-notarized build, so this check is load-bearing.
      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      # The secret APPLE_API_KEY holds the .p8 contents; electron-builder wants
      # the env var APPLE_API_KEY to be a path to that file.
      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # electron-builder 26.15.3 passes the .p12 password to
      # `security set-key-partition-list` instead of the temporary keychain's
      # password, which macOS 26 rejects. So we import the certificate into our
      # own keychain and let electron-builder discover it from the search list.
      - name: Import signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Stay unlocked (6h) through notarization.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # Prepend to the user search list, keeping the existing keychains.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$identities"
          if ! grep -q "Developer ID Application" <<<"$identities"; then
            echo "::error::No Developer ID Application identity in the imported certificate"
            exit 1
          fi

      # No CSC_LINK and no CSC_IDENTITY_AUTO_DISCOVERY here: electron-builder
      # finds the Developer ID identity imported above, signs and notarizes
      # each .app (x64 and arm64) with the APPLE_API_* credentials. The dmg
      # itself is neither signed nor notarized.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # GitHub publishing is handled by the publish job below; tell
          # electron-builder not to attempt its own publish.
          GH_TOKEN: ''
        run: npx ${{ matrix.build_script }} --publish never

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          # Windows stays unsigned (SmartScreen warns on first launch). The
          # Windows job must never receive CSC_LINK: electron-builder would try
          # to sign with the macOS certificate. Never set this to an empty
          # string; only the literal 'false' disables auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
        run: npx ${{ matrix.build_script }} --publish never

      # Fails the job if a packaged app ships with a fuse in the wrong state
      # (electron-builder.yml `electronFuses`), on every OS and arch slice.
      - name: Verify Electron fuses
        run: node scripts/verify-fuses.mjs

      # Validates the two .app bundles (the dmg is not notarized). The bundle
      # name contains an apostrophe, so every path stays quoted.
      - name: Verify signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac/*.app release/mac-arm64/*.app)
          if [ "${#apps[@]}" -lt 2 ]; then
            echo "::error::Expected 2 .app bundles (x64 and arm64), found ${#apps[@]}"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            out="$(spctl -a -t exec -vvv "$app" 2>&1)"
            echo "$out"
            if ! grep -q 'source=Notarized Developer ID' <<<"$out"; then
              echo "::error::$app is not accepted as Notarized Developer ID"
              exit 1
            fi
            xcrun stapler validate "$app"
          done

      # Hands the release files to the publish job on a tag, and keeps them as
      # workflow outputs on a workflow_dispatch dry run. Only the release files,
      # not all of release/ (the unpacked .app dirs are large). The common
      # `release/` prefix is stripped inside the artifact.
      - name: Upload release files as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It runs once every build leg has passed,
  # so a failed OS leg skips publishing entirely instead of leaving a release
  # with half its assets.
  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required by softprops/action-gh-release to create the release and
    # attach assets.
    permissions:
      contents: write
    steps:
      # `path: release` restores the prefix the upload stripped, so the globs
      # below match.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          # Don't fail if a glob matches nothing (e.g., the .yml feed file
          # naming conventions vary across electron-builder versions).
          fail_on_unmatched_files: false
          generate_release_notes: true
