name: CI

# A docs-only change runs nothing. `docs/` and `specs/` hold Markdown and
# nothing else, so `**.md` covers every documentation path on its own — with
# one carve-out: `tests/unit/troubleshooting-doc.spec.ts` asserts that
# `docs/troubleshooting.md` still matches the recipe registry, so editing that
# one file can break a test and must keep triggering CI. Negation only works
# inside `paths`, never `paths-ignore`, hence the include-all-then-subtract
# shape; the last matching pattern wins.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - 'docs/troubleshooting.md'
  # Only PRs targeting main — ticket → feature-base PRs run their gates locally.
  pull_request:
    branches: [main]
    # Repeated rather than shared: GitHub Actions does not resolve YAML anchors.
    paths:
      - '**'
      - '!**.md'
      - 'docs/troubleshooting.md'
  # Manual entry point, mainly for running e2e against a branch that is not yet
  # in a PR to `main`. No path filter — a hand-triggered run is always
  # deliberate.
  workflow_dispatch:

# Least privilege, set explicitly rather than inherited. This workflow only
# ever reads the repository — it does not comment, label, or push. Declaring it
# here means the token stays read-only even if the repository-wide default is
# later set to read/write. Fork PRs are already capped at read by GitHub, so
# this is about runs on `main` and on branches in this repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, runs on every push and every PR.
  test:
    name: Lint + audit + unit / integration / component
    # A manual dispatch is for e2e; these are cheap to run locally and would
    # otherwise add ~7 minutes to every hand-triggered Playwright run.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Must stay above `run-tests.mjs`'s per-project watchdog (15m), or GitHub
    # cancels the job first and the watchdog's hang diagnostic can never print
    # here — which is the only place it matters.
    # The job today is ~7m: install + Electron + lint + typecheck + audit +
    # ~5m of tests. 25 leaves the watchdog room to fire and still bounds a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can tell new code from old by blame.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # `npm ci`, not `npm install`: it fails the job when the lockfile and
      # package.json disagree instead of quietly resolving something else, and
      # it is what S8543 asks for. An older comment here claimed `npm ci`
      # refuses on this runner because the lockfile is resolved on macOS and
      # skips the transitive deps of Linux-only platform binaries. That is no
      # longer true — checked on ubuntu-latest before this change, not assumed.
      #
      # `--ignore-scripts` (S6505) defers exactly one thing: mongodb-memory-server
      # pre-downloading mongod, which it fetches lazily on first use instead.
      # Nothing else in the tree declares an install hook that matters here —
      # electron 44 has none at all, and the Electron binary is unzipped by hand
      # in the next step precisely because its own installer no-ops on this
      # runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # electron's bundled installer downloads the release zip fine, but its
      # extract-zip step silently no-ops on this runner (Node 24 / ubuntu-latest):
      # it leaves node_modules/electron/dist with only locales/ and never writes
      # path.txt, so require('electron') throws "Electron failed to install
      # correctly" in the diagnostic-service integration test. Extract the zip
      # ourselves with system unzip (deterministic), then write path.txt.
      - name: Install Electron binary
        run: |
          ver=$(node -p "require('./node_modules/electron/package.json').version")
          zip="electron-v${ver}-linux-x64.zip"
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "/tmp/${zip}" \
            "https://github.com/electron/electron/releases/download/v${ver}/${zip}"
          rm -rf node_modules/electron/dist
          unzip -q "/tmp/${zip}" -d node_modules/electron/dist
          printf electron > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron \
            && echo "electron binary OK ($ver)" \
            || { echo "::error::electron binary missing after unzip"; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit IPC secret allowlist
        run: npm run audit:ipc

      # `--ignore-scripts` above skipped mongodb-memory-server's own download of
      # mongod, so without this the integration workers each find the cache
      # empty and race to fill it; the loser fails with "Cannot unlock file
      # .../mongodb-binaries/<version>.lock" before its first test. One download
      # here, before any worker starts, leaves them all a cache hit.
      - name: Download mongod
        run: node node_modules/mongodb-memory-server/postinstall.js

      - name: Unit + integration + component tests
        run: npm test -- --coverage

      # Sends the coverage above, with the code analysis, to SonarCloud. A fork's
      # PR gets no secrets, so it is skipped there rather than failed.
      - name: SonarCloud scan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs on PRs targeting `main`, on pushes to `main`, and on manual dispatch.
  # It was `workflow_dispatch`-only while free runner minutes were the binding
  # constraint; that constraint is gone, and a manual-only gate does not survive
  # contact with contributors who cannot dispatch it. A PR into a feature base
  # still triggers nothing — run it locally there.
  e2e:
    name: Playwright + Electron (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Split across runners rather than made parallel on one. Each test pays a
    # full Electron launch plus a mongodb-memory-server spin-up, both roughly
    # 10x slower here than locally — measured at ~24s/test, 1601s of a 28.3m
    # job, against ~92s of setup. Caching the setup was the obvious lever and
    # it is worth nothing; the test time is the job.
    #
    # `workers: 1` stays inside each shard on purpose. Raising it is the other
    # way to spend the same runner, and it shares an Electron and a Mongo
    # between concurrent tests — mongodb-memory-server is already known fragile
    # under CPU contention. Four processes on four machines keeps every test as
    # isolated as it is today and costs only billed minutes, not correctness.
    #
    # Four, not more. Measured on run 34640889050: 8.2m / 6.9m / 10.4m / 8.1m,
    # so the slowest shard is the job, at 10.4m against 28.3m before. That is
    # level with the ~10.4m test job, which now sets the floor for the whole
    # workflow — a fifth shard, or evening out the 6.9-10.4m spread, would
    # shorten this job and not the run.
    #
    # A spec file is never split down the middle. Playwright shards whole test
    # groups, and with `fullyParallel: false` a group is a file — so a file
    # whose tests build on each other still runs in order, in one process.
    strategy:
      # A red shard must not cancel the other three — one of them failing too
      # is the difference between a flake and a break.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 20 against a measured 10.4m worst shard. The headroom is for the spread,
    # not for comfort: shard 3 draws the heavy specs today and a new spec file
    # lands wherever the split puts it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # `npm ci`, not `npm install`: it fails the job when the lockfile and
      # package.json disagree instead of quietly resolving something else, and
      # it is what S8543 asks for. An older comment here claimed `npm ci`
      # refuses on this runner because the lockfile is resolved on macOS and
      # skips the transitive deps of Linux-only platform binaries. That is no
      # longer true — checked on ubuntu-latest before this change, not assumed.
      #
      # `--ignore-scripts` (S6505) defers exactly one thing: mongodb-memory-server
      # pre-downloading mongod, which it fetches lazily on first use instead.
      # Nothing else in the tree declares an install hook that matters here —
      # electron 44 has none at all, and the Electron binary is unzipped by hand
      # in the next step precisely because its own installer no-ops on this
      # runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # electron's bundled installer downloads the release zip fine, but its
      # extract-zip step silently no-ops on this runner (Node 24 / ubuntu-latest):
      # it leaves node_modules/electron/dist with only locales/ and never writes
      # path.txt, so electron.launch fails every e2e test with "Electron failed
      # to install correctly". Extract the zip ourselves with system unzip
      # (deterministic), then write path.txt.
      - name: Install Electron binary
        run: |
          ver=$(node -p "require('./node_modules/electron/package.json').version")
          zip="electron-v${ver}-linux-x64.zip"
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "/tmp/${zip}" \
            "https://github.com/electron/electron/releases/download/v${ver}/${zip}"
          rm -rf node_modules/electron/dist
          unzip -q "/tmp/${zip}" -d node_modules/electron/dist
          printf electron > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron \
            && echo "electron binary OK ($ver)" \
            || { echo "::error::electron binary missing after unzip"; exit 1; }

      - name: Install Playwright system deps
        run: ./node_modules/.bin/playwright install-deps

      # The secrets-vault specs need a real OS keyring. A bare runner has no
      # session D-Bus and no secret service, so Chromium falls back to its
      # `basic_text` backend, which `isWeakBackend` rejects by design and the
      # vault answers with SECRETS_UNAVAILABLE. Both vault specs used to skip
      # on that, which left credential storage with no CI coverage at all.
      - name: Install a session keyring
        # `apt-get update` is explicit rather than inherited from the step
        # above. `dbus-daemon` ships `dbus-run-session` and `dbus-bin` ships
        # `dbus-send`, which the next step uses to check the keyring.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus-daemon dbus-bin

      - name: Run E2E
        env:
          # Chromium picks its Linux password store from the desktop
          # environment; without one it never tries libsecret.
          XDG_CURRENT_DESKTOP: GNOME
        # `dbus-run-session` gives the job its own session bus, and a keyring
        # daemon is started and unlocked on it with a throwaway password that
        # exists for this job alone. The daemon's own exit status and output
        # are not a reliable sign it worked (it exits 0 on a bad flag), so the
        # step waits for the secret service to own its bus name and fails
        # unless the default keyring reads as unlocked. It waits with
        # `NameHasOwner`, not by asking the service itself: a request to the
        # service name starts a second, locked daemon that can win the name
        # from the unlocked one. An Electron started in this session selects
        # `gnome_libsecret` from `XDG_CURRENT_DESKTOP`. Playwright's own
        # Electron launcher would defeat that: its loader
        # (`playwright-core/lib/server/electron/loader.js`) appends
        # `--password-store=basic` to the app it starts, which wins over a flag
        # passed in `args`. So the two secrets-vault specs launch the app
        # through an explicit `executablePath`, which skips that loader
        # (`nativeCredentialStoreLaunch` in `tests/helpers/e2eApp.ts`), and fail
        # rather than skip if no real keyring is selected.
        #
        # Electron needs an X server on Linux even when launched
        # programmatically; xvfb-run stands one up for the test process.
        #
        # `test:e2e` is `npm run build && npx playwright test`, so every shard
        # builds its own bundle. That is deliberate: the build is seconds, and
        # sharing one through an artifact would trade it for an upload, a
        # download, and a way for a shard to test a bundle it did not make.
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            openssl rand -hex 16 | tr -d "\n" | gnome-keyring-daemon --unlock --components=secrets
            for _ in $(seq 1 20); do
              owned=$(dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets 2>&1 || true)
              case "$owned" in *"boolean true"*) break;; esac
              sleep 0.5
            done
            state=$(dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets/collection/login org.freedesktop.DBus.Properties.Get string:org.freedesktop.Secret.Collection string:Locked 2>&1 || true)
            case "$state" in *"boolean false"*) ;; *) echo "::error::the login keyring is missing or still locked: $state"; exit 1;; esac
            exec xvfb-run --auto-servernum npm run test:e2e -- --shard=${{ matrix.shard }}/4'

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unique per shard — upload-artifact v4 refuses a name that already
          # exists, so a shared one would fail every shard after the first.
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
