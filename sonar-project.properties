# Read by the SonarCloud scan step in .github/workflows/ci.yml. Automatic
# Analysis must stay off in the SonarCloud project settings: it cannot import
# coverage, and SonarCloud refuses a CI scan while it is on.
sonar.organization=anonhym
sonar.projectKey=anonhym_latelier

# Tests are declared as tests, which also keeps their deliberate repetition
# out of copy-paste detection.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests

# One report per vitest project (scripts/run-tests.mjs); SonarCloud merges them.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info,coverage/component/lcov.info
# Coverage is measured over electron/, src/ and shared/ only (vitest.config.ts).
sonar.coverage.exclusions=scripts/**,.claude/**,*.config.*
